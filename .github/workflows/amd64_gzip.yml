name: x86-64 Pull and Save to Gzip
on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写容器镜像名称(x86-64架构)，多个用英文逗号分开'
        required: true
        default: 'alpine:latest'  # 设置默认的 Docker 镜像列表

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 升级到 v6/v7 后可移除此行

jobs:
  pull_and_package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2

    - name: Clean up Docker to free space
      run: |
          docker system prune -a -f
          docker volume prune -f

    - name: Pull Docker Images and Package
      run: |
        images="${{ github.event.inputs.docker_images }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          docker pull "${image}" --platform "linux/amd64"
          safe_name="${image//\//_}"
          safe_name="${safe_name//:/_}"
          docker save "${image}" | gzip > "${safe_name}-amd64-docker-image.tar.gz"
        done

    - name: Compress the gzip files
      #run: tar -czf x86-64-images.tar.gz *-amd64-docker-image.tar.gz
      #run: zip x86-64-images.zip *-amd64-docker-image.tar.gz
      run: mkdir -p x86-64-images && cp *-amd64-docker-image.tar.gz x86-64-images/

    - name: Upload artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: docker-images-x86-64
        path: x86-64-images    # x86-64-images.zip  # x86-64-images.tar.gz
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天

    - name: Clean up intermediate files
      run: |
        rm *-amd64-docker-image.tar.gz
