name: ARM64 Pull and Save to Gzip
on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'alpine:latest,ubuntu:latest'  # 设置默认的 Docker 镜像列表

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 升级到 v6/v7 后可移除此行

jobs:
  pull_and_package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2

    - name: Pull Docker Images and Package
      run: |
        images="${{ github.event.inputs.docker_images }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          docker pull "${image}" --platform "linux/arm64"
          safe_name="${image//\//_}"
          safe_name="${safe_name//:/_}"
          docker save "${image}" | gzip > "${safe_name}-arm64-docker-image.tar.gz"
        done

    - name: Compress the gzip files
      #run: zip arm64-images.zip *-arm64-docker-image.tar.gz
      run: mkdir -p arm64-images && cp *-arm64-docker-image.tar.gz arm64-images/

    - name: Upload artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: docker-images-zip
        path: arm64-images  # arm64-images.zip
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天

    - name: Clean up intermediate files
      run: |
        rm *-arm64-docker-image.tar.gz
